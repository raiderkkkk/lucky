# .github/workflows/deploy.yml
# ============================================================
# GitHub Actions: Deploy automático a GitHub Pages
#
# Se activa en cada push a la rama main.
# Instala dependencias, construye el proyecto y despliega
# la carpeta dist/ a la rama gh-pages.
# ============================================================

name: Deploy PS1 World to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # Permite ejecutar manualmente desde GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Instalar dependencias
      - name: Install dependencies
        run: npm ci

      # 4. Construir el proyecto
      - name: Build
        run: npm run build

      # 5. Desplegar dist/ a la rama gh-pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          commit_message: 'deploy: ${{ github.event.head_commit.message }}'
